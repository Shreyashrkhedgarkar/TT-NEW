<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Offline | Robotics Core</title>
    <!-- Google Fonts for Futuristic Look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff0055;
            --bg-dark: #080b10;
            --card-bg: rgba(13, 20, 32, 0.75);
            --text-color: #e2f1f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Grid & Circuit Background */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px);
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        /* Ambient Glowing Orbs */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 2;
        }

        .orb-1 { background: var(--primary); top: 10%; left: 15%; opacity: 0.2; }
        .orb-2 { background: var(--secondary); bottom: 10%; right: 15%; opacity: 0.15; }

        /* Main Container Card */
        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 50px 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15),
                        inset 0 0 15px rgba(0, 240, 255, 0.05);
            animation: cardAppear 1s ease-out;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Futuristic Corner Accents */
        .corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--primary);
            border-style: solid;
        }
        .top-left { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .top-right { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
        .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
        .bottom-right { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        /* Robotic Icon Indicator */
        .robot-status-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }

        .status-dot {
            width: 20px;
            height: 20px;
            background-color: var(--secondary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--secondary);
            animation: pulse 1.5s infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } }

        /* Typography */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        p {
            font-size: 1.1rem;
            color: #a0aec0;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .highlight {
            color: var(--primary);
            font-weight: 600;
        }

        /* Action Button */
        .btn-continue {
            font-family: 'Orbitron', sans-serif;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn-continue:hover {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
            transform: translateY(-2px);
        }

        .btn-continue:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Main Card -->
    <div class="container">
        <!-- Tech Corners -->
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <!-- Robot System Status Indicator -->
        <div class="robot-status-icon">
            <div class="icon-ring"></div>
            <div class="status-dot"></div>
        </div>

        <!-- Text Content -->
        <h1>WE ARE BACK SOON</h1>
        <p>System core is currently <span class="highlight">offline</span> for updates & calibration. Robotic data server is undergoing maintenance.</p>

        <!-- Redirect Button -->
        <button class="btn-continue" onclick="goToWebsite()">Continue to Website</button>
    </div>

    <script>
        function goToWebsite() {
            // Replace the link below with your actual main website URL
            const targetWebsite = "file:///c%3A/Users/24071/Pictures/SS/TT/ttp2.html#"; 

            // Smooth transition before redirect
            document.querySelector('.container').style.transform = 'scale(0.9)';
            document.querySelector('.container').style.opacity = '0';
            document.querySelector('.container').style.transition = 'all 0.4s ease';

            setTimeout(() => {
                window.location.href = targetWebsite;
            }, 400);
        }
    </script>
</body>
</html>
